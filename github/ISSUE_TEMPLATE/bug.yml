name: Found a bug? You should go here.
description: Form to submit a bug.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please fill this form to help me understand your issue.\n\n**Also, for God's sake, please read the guide on the GitHub Wiki again before creating an issue.**"
  - type: dropdown
    id: platform
    attributes:
      label: Select your platform
      options:
        - Windows
        - Android64
        - Android32
        - Mac (Intel)
        - Mac (arm)
        - iOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe your issue
      placeholder: When I click here happens this
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce the bug
      placeholder: |
        1. Go somewhere
        2. Click here
        3. Click there
    validations:
      required: true
  - type: checkboxes
    id: geodeisupdated
    attributes:
      label: Extra fields
      options:
        - label: I updated Geode/Geode Launcher to the latest version.
          required: true
        - label: I updated this mod to the latest version.
          required: true
  - type: markdown
    attributes:
      value: Thanks for reporting this bug. I'll try to fix it as soon as possible.
